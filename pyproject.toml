[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashdepth-inference"
version = "0.1.0"
description = "FlashDepth Real-time Video Depth Estimation Inference Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "xformers==0.0.27.post2",
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.0",
    "numpy",
    "opencv-python",
    "pillow",
    "einops",
    "scipy",
    "h5py",
    "flash-attn",
    "tqdm",
    "hydra-core",
    "omegaconf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
]

[project.scripts]
flashdepth-serve = "app:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88