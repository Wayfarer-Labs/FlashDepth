version: '3.8'

services:
  flashdepth-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount model checkpoint directory
      - ./configs:/app/configs:ro
      # Mount output directory for results
      - ./outputs:/app/outputs
      # Optional: mount custom models
      - ./models:/app/models:ro
    environment:
      - FLASHDEPTH_CONFIG_PATH=configs/flashdepth
      - FLASHDEPTH_MODEL_CHECKPOINT=/app/configs/flashdepth/iter_43002.pth
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - flashdepth-api
    restart: unless-stopped
    profiles:
      - production

volumes:
  model_cache:
    driver: local